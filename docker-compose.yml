services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: conference_root
      MYSQL_DATABASE: conference_management
    ports: ['3306:3306']
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run seed && npm start"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: conference_root
      DB_NAME: conference_management
      JWT_SECRET: change-this-secret-in-production
      CLIENT_ORIGIN: http://localhost:5173
    ports: ['5000:5000']
    volumes: ['./backend:/app']
    depends_on: [mysql]
volumes:
  mysql_data:
