<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DYPESCONF - Conference & Delegate Portal">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DYPESCONF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DYPESCONF</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select {
      -webkit-user-select: auto !important;
      user-select: auto !important;
      touch-action: auto !important;
    }
    flt-glass-pane {
      touch-action: manipulation !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // Automatic Direct Photo Download Engine for DYPESCONF
    (function() {
      var origOpen = window.open;
      window.open = function(url, target, features) {
        if (typeof url === 'string') {
          var isImage = /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(url) || url.indexOf('/uploads/') !== -1 || url.indexOf('/api/download') !== -1;
          if (isImage) {
            var filename = url.split('/').pop().split('?')[0] || ('conference_photo_' + Date.now() + '.jpg');
            if (filename.indexOf('.') === -1) filename += '.jpg';
            var downloadUrl = url.indexOf('/api/download') !== -1 ? url : ('/api/download?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(filename));

            // Fetch as blob for instant direct download without opening new tabs
            fetch(url)
              .then(function(res) {
                if (!res.ok) throw new Error('Fetch failed');
                return res.blob();
              })
              .then(function(blob) {
                var blobUrl = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                  window.URL.revokeObjectURL(blobUrl);
                  document.body.removeChild(a);
                }, 1000);
              })
              .catch(function() {
                var a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(function() {
                  document.body.removeChild(a);
                }, 1000);
              });
            return null;
          }
        }
        return origOpen.apply(this, arguments);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
