# -----------------------------------------------------------
# 1. Main Domain -> Flutter Delegate Web App (dypesconf.io)
# -----------------------------------------------------------
server {
    listen 80;
    server_name dypesconf.io www.dypesconf.io;

    root /var/www/conference_app/backend/public_web/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
    }
}

# -----------------------------------------------------------
# 2. Admin Subdomain -> React Admin Panel (admin.dypesconf.io)
# -----------------------------------------------------------
server {
    listen 80;
    server_name admin.dypesconf.io;

    root /var/www/conference_app/backend/public_web/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
    }
}

# -----------------------------------------------------------
# 3. API Subdomain -> Node.js Backend (api.dypesconf.io)
# -----------------------------------------------------------
server {
    listen 80;
    server_name api.dypesconf.io;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
